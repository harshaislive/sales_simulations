<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pipeline Intelligence</title>
    <style>
        body { background: #faf9f6; font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 3rem; border: 1px solid #ddd; border-top: 4px solid #000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; width: 100%; max-width: 350px; }
        h1 { font-family: 'Georgia', serif; font-size: 1.8rem; margin-bottom: 2rem; margin-top: 0; }
        input { width: 100%; padding: 1rem; margin-bottom: 1rem; border: 1px solid #ccc; font-size: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 1rem; background: #000; color: white; border: none; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        button:hover { background: #333; }
        .error { color: red; font-size: 0.9rem; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Intelligence Hub</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <input type="password" name="password" placeholder="Enter Team Password" required autofocus>
            <button type="submit">Access Dashboard</button>
        </form>
    </div>
</body>
</html>
